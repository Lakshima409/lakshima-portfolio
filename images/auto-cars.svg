<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <g opacity="0.3">
    <circle cx="150" cy="120" r="110" fill="#22C55E"/>
    <circle cx="700" cy="400" r="140" fill="#3B82F6"/>
  </g>

  <g>
    <rect x="100" y="80" width="600" height="340" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
    
    <text x="150" y="140" fill="#F1F5F9" font-family="Arial, sans-serif" font-size="32" font-weight="700">Auto Cars</text>
    
    <g transform="translate(140, 165)">
      <!-- Analysis Phase -->
      <rect x="0" y="0" width="110" height="90" fill="#0F172A" stroke="#22C55E" stroke-width="2" rx="8"/>
      <text x="15" y="30" fill="#86EFAC" font-size="24">📋</text>
      <text x="10" y="65" fill="#E2E8F0" font-size="12" font-weight="600">Analysis</text>
      
      <!-- Arrow -->
      <line x1="115" y1="45" x2="140" y2="45" stroke="#6B7280" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Design Phase -->
      <rect x="150" y="0" width="110" height="90" fill="#0F172A" stroke="#3B82F6" stroke-width="2" rx="8"/>
      <text x="165" y="30" fill="#93C5FD" font-size="24">🎨</text>
      <text x="165" y="65" fill="#E2E8F0" font-size="12" font-weight="600">Design</text>
      
      <!-- Arrow -->
      <line x1="265" y1="45" x2="290" y2="45" stroke="#6B7280" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Specification Phase -->
      <rect x="300" y="0" width="110" height="90" fill="#0F172A" stroke="#F59E0B" stroke-width="2" rx="8"/>
      <text x="320" y="30" fill="#FBBF24" font-size="24">📐</text>
      <text x="310" y="65" fill="#E2E8F0" font-size="12" font-weight="600">Specification</text>
    </g>
    
    <rect x="140" y="310" width="520" height="50" rx="10" fill="#0F172A" stroke="#22C55E" stroke-width="2"/>
    <text x="165" y="330" fill="#86EFAC" font-size="14" font-weight="600">Feasibility · Requirements · SRS · UI/UX · Full SDLC</text>
    <text x="165" y="350" fill="#94A3B8" font-size="13">End-to-End Systems Analysis for Web-Based Taxi Booking</text>
  </g>
</svg>
